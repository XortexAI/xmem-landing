<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#060606"/>
  <rect x="92" y="86" width="1416" height="728" rx="24" fill="#0A0A0A" stroke="white" stroke-opacity="0.08"/>
  <path d="M180 256C354 167 502 181 664 277C842 382 970 385 1130 292C1266 213 1374 235 1430 276" stroke="url(#trace)" stroke-width="2"/>
  <path d="M178 610C339 700 504 693 662 599C835 495 972 500 1131 593C1277 679 1382 649 1430 610" stroke="url(#traceSoft)" stroke-width="2"/>

  <text x="150" y="178" fill="white" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="750">Agentic pipeline structure</text>
  <text x="152" y="224" fill="white" fill-opacity="0.52" font-family="Inter, Arial, sans-serif" font-size="21">A deliberate memory loop: propose, judge, commit, and retrieve with source-aware context.</text>

  <g transform="translate(150 328)">
    <rect width="230" height="214" rx="18" fill="#111111" stroke="white" stroke-opacity="0.12"/>
    <text x="28" y="48" fill="#B8FF65" font-family="JetBrains Mono, monospace" font-size="15">01 / ingest</text>
    <text x="28" y="88" fill="white" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">Conversation turn</text>
    <text x="28" y="128" fill="white" fill-opacity="0.55" font-family="Inter, Arial, sans-serif" font-size="16">query</text>
    <text x="28" y="156" fill="white" fill-opacity="0.55" font-family="Inter, Arial, sans-serif" font-size="16">agent response</text>
    <text x="28" y="184" fill="white" fill-opacity="0.55" font-family="Inter, Arial, sans-serif" font-size="16">user, time, source</text>
  </g>

  <g transform="translate(440 286)">
    <rect width="250" height="298" rx="18" fill="#0F0F0F" stroke="white" stroke-opacity="0.12"/>
    <text x="28" y="48" fill="#B8FF65" font-family="JetBrains Mono, monospace" font-size="15">02 / route</text>
    <text x="28" y="88" fill="white" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">Classifier</text>
    <text x="28" y="126" fill="white" fill-opacity="0.55" font-family="Inter, Arial, sans-serif" font-size="16">Selects memory domains</text>
    <rect x="28" y="164" width="88" height="34" rx="17" fill="#B8FF65" fill-opacity="0.12"/>
    <text x="50" y="186" fill="#D8FFAD" font-family="Inter, Arial, sans-serif" font-size="14">profile</text>
    <rect x="126" y="164" width="96" height="34" rx="17" fill="#3DD8FF" fill-opacity="0.10"/>
    <text x="148" y="186" fill="#A8EDFF" font-family="Inter, Arial, sans-serif" font-size="14">temporal</text>
    <rect x="28" y="212" width="92" height="34" rx="17" fill="white" fill-opacity="0.06"/>
    <text x="52" y="234" fill="white" fill-opacity="0.66" font-family="Inter, Arial, sans-serif" font-size="14">code</text>
    <rect x="130" y="212" width="92" height="34" rx="17" fill="white" fill-opacity="0.06"/>
    <text x="150" y="234" fill="white" fill-opacity="0.66" font-family="Inter, Arial, sans-serif" font-size="14">image</text>
  </g>

  <g transform="translate(750 252)">
    <rect width="278" height="366" rx="18" fill="#111111" stroke="#B8FF65" stroke-opacity="0.24"/>
    <text x="30" y="50" fill="#B8FF65" font-family="JetBrains Mono, monospace" font-size="15">03 / propose</text>
    <text x="30" y="92" fill="white" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">Domain agents</text>
    <text x="30" y="130" fill="white" fill-opacity="0.55" font-family="Inter, Arial, sans-serif" font-size="16">Each specialist extracts one</text>
    <text x="30" y="156" fill="white" fill-opacity="0.55" font-family="Inter, Arial, sans-serif" font-size="16">kind of candidate memory.</text>
    <path d="M30 202H248" stroke="white" stroke-opacity="0.1"/>
    <text x="30" y="236" fill="white" fill-opacity="0.74" font-family="Inter, Arial, sans-serif" font-size="17">Facts and preferences</text>
    <text x="30" y="272" fill="white" fill-opacity="0.74" font-family="Inter, Arial, sans-serif" font-size="17">Events and decisions</text>
    <text x="30" y="308" fill="white" fill-opacity="0.74" font-family="Inter, Arial, sans-serif" font-size="17">Summaries and snippets</text>
    <text x="30" y="344" fill="white" fill-opacity="0.74" font-family="Inter, Arial, sans-serif" font-size="17">Repository context</text>
  </g>

  <g transform="translate(1088 286)">
    <rect width="250" height="298" rx="18" fill="#0F0F0F" stroke="white" stroke-opacity="0.12"/>
    <text x="28" y="48" fill="#B8FF65" font-family="JetBrains Mono, monospace" font-size="15">04 / verify</text>
    <text x="28" y="88" fill="white" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">Judge</text>
    <text x="28" y="126" fill="white" fill-opacity="0.55" font-family="Inter, Arial, sans-serif" font-size="16">Compares candidates to</text>
    <text x="28" y="152" fill="white" fill-opacity="0.55" font-family="Inter, Arial, sans-serif" font-size="16">existing memory.</text>
    <text x="28" y="210" fill="#D8FFAD" font-family="JetBrains Mono, monospace" font-size="16">add</text>
    <text x="86" y="210" fill="white" fill-opacity="0.38" font-family="JetBrains Mono, monospace" font-size="16">update</text>
    <text x="174" y="210" fill="white" fill-opacity="0.38" font-family="JetBrains Mono, monospace" font-size="16">skip</text>
  </g>

  <g transform="translate(395 680)">
    <rect width="810" height="72" rx="16" fill="#B8FF65" fill-opacity="0.08" stroke="#B8FF65" stroke-opacity="0.22"/>
    <text x="30" y="45" fill="#D8FFAD" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">The extractor proposes. The judge explains. The weaver commits only approved memory.</text>
  </g>

  <path d="M390 435H424" stroke="white" stroke-opacity="0.36" stroke-width="2"/>
  <path d="M418 427L426 435L418 443" stroke="white" stroke-opacity="0.36" stroke-width="2"/>
