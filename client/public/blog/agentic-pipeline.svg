  <path d="M1038 435H1072" stroke="white" stroke-opacity="0.36" stroke-width="2"/>
  <path d="M1066 427L1074 435L1066 443" stroke="white" stroke-opacity="0.36" stroke-width="2"/>
  <path d="M1338 435H1406V636H1208" stroke="white" stroke-opacity="0.2" stroke-width="2"/>

  <defs>
    <linearGradient id="trace" x1="180" y1="240" x2="1430" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8FF65" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#B8FF65" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#3DD8FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="traceSoft" x1="178" y1="650" x2="1430" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3DD8FF" stop-opacity="0"/>
