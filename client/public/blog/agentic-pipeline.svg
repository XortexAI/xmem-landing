<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#050505"/>
  <path d="M0 0H1600V900H0V0Z" fill="url(#grid)"/>
  <rect x="106" y="136" width="1388" height="628" rx="16" fill="#0B0B0B" stroke="white" stroke-opacity="0.11"/>
  <text x="138" y="206" fill="white" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">XMem agentic memory pipeline</text>
  <text x="140" y="248" fill="white" fill-opacity="0.54" font-family="Inter, Arial, sans-serif" font-size="20">Classifier, domain agents, judge-before-write, and weaver stages turn chat into durable memory.</text>

  <g transform="translate(142 342)">
    <rect width="210" height="134" rx="12" fill="#111" stroke="#B8FF65" stroke-opacity="0.48"/>
    <text x="24" y="48" fill="#D8FFAD" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Input turn</text>
    <text x="24" y="82" fill="white" fill-opacity="0.55" font-family="Inter, Arial, sans-serif" font-size="15">query, response,</text>
    <text x="24" y="106" fill="white" fill-opacity="0.55" font-family="Inter, Arial, sans-serif" font-size="15">user_id, time, image</text>
  </g>

  <g transform="translate(420 300)">
    <rect width="212" height="218" rx="12" fill="#111" stroke="white" stroke-opacity="0.14"/>
    <text x="24" y="48" fill="white" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Classifier</text>
    <text x="24" y="82" fill="white" fill-opacity="0.55" font-family="Inter, Arial, sans-serif" font-size="15">Chooses domains</text>
    <rect x="24" y="112" width="164" height="30" rx="6" fill="#B8FF65" fill-opacity="0.11"/>
    <text x="40" y="133" fill="#D8FFAD" font-family="JetBrains Mono, monospace" font-size="13">profile</text>
    <rect x="24" y="152" width="164" height="30" rx="6" fill="#3DD8FF" fill-opacity="0.10"/>
    <text x="40" y="173" fill="#A8EDFF" font-family="JetBrains Mono, monospace" font-size="13">temporal</text>
  </g>

  <g transform="translate(700 268)">
    <rect width="242" height="282" rx="12" fill="#111" stroke="white" stroke-opacity="0.14"/>
    <text x="24" y="48" fill="white" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Domain agents</text>
    <text x="24" y="82" fill="white" fill-opacity="0.55" font-family="Inter, Arial, sans-serif" font-size="15">Extract candidate memory</text>
    <text x="24" y="126" fill="white" fill-opacity="0.72" font-family="Inter, Arial, sans-serif" font-size="15">Profile</text>
    <text x="24" y="158" fill="white" fill-opacity="0.72" font-family="Inter, Arial, sans-serif" font-size="15">Temporal</text>
    <text x="24" y="190" fill="white" fill-opacity="0.72" font-family="Inter, Arial, sans-serif" font-size="15">Summary</text>
    <text x="24" y="222" fill="white" fill-opacity="0.72" font-family="Inter, Arial, sans-serif" font-size="15">Code and snippet</text>
    <text x="24" y="254" fill="white" fill-opacity="0.72" font-family="Inter, Arial, sans-serif" font-size="15">Image</text>
  </g>

  <g transform="translate(1010 300)">
    <rect width="212" height="218" rx="12" fill="#111" stroke="#B8FF65" stroke-opacity="0.48"/>
    <text x="24" y="48" fill="#D8FFAD" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Judge</text>
    <text x="24" y="82" fill="white" fill-opacity="0.55" font-family="Inter, Arial, sans-serif" font-size="15">Approves mutations</text>
    <text x="24" y="126" fill="white" fill-opacity="0.72" font-family="JetBrains Mono, monospace" font-size="14">add</text>
    <text x="24" y="154" fill="white" fill-opacity="0.72" font-family="JetBrains Mono, monospace" font-size="14">update</text>
    <text x="24" y="182" fill="white" fill-opacity="0.72" font-family="JetBrains Mono, monospace" font-size="14">delete / skip</text>
  </g>

  <g transform="translate(1290 342)">
    <rect width="170" height="134" rx="12" fill="#111" stroke="white" stroke-opacity="0.14"/>
    <text x="24" y="48" fill="white" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Weaver</text>
    <text x="24" y="82" fill="white" fill-opacity="0.55" font-family="Inter, Arial, sans-serif" font-size="15">Commits clean</text>
    <text x="24" y="106" fill="white" fill-opacity="0.55" font-family="Inter, Arial, sans-serif" font-size="15">memory writes</text>
  </g>

  <path d="M364 409H404" stroke="white" stroke-opacity="0.45" stroke-width="2"/>
  <path d="M398 401L406 409L398 417" stroke="white" stroke-opacity="0.45" stroke-width="2"/>
  <path d="M644 409H684" stroke="white" stroke-opacity="0.45" stroke-width="2"/>
  <path d="M678 401L686 409L678 417" stroke="white" stroke-opacity="0.45" stroke-width="2"/>
  <path d="M954 409H994" stroke="white" stroke-opacity="0.45" stroke-width="2"/>
  <path d="M988 401L996 409L988 417" stroke="white" stroke-opacity="0.45" stroke-width="2"/>
  <path d="M1234 409H1274" stroke="white" stroke-opacity="0.45" stroke-width="2"/>
  <path d="M1268 401L1276 409L1268 417" stroke="white" stroke-opacity="0.45" stroke-width="2"/>

  <g transform="translate(420 622)">
    <rect width="760" height="74" rx="12" fill="#B8FF65" fill-opacity="0.08" stroke="#B8FF65" stroke-opacity="0.28"/>
    <text x="28" y="45" fill="#D8FFAD" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">The extraction agent proposes. The Judge decides. The Weaver applies.</text>
  </g>

  <defs>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="white" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
</svg>
